services:
  postgres:
    image: postgres:17
    container_name: dress-share-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dressshare
      POSTGRES_PASSWORD: dressshare_dev
      POSTGRES_DB: dressshare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: